 18px;font:inherit;font-weight:900;background:var(--primary);color:white;cursor:pointer;box-shadow:0 10px 25px rgba(59,109,246,.24);min-height:50px}.btn:hover{filter:brightness(.95)}.btn.secondary{background:#e2e8f0;color:#1e293b;box-shadow:none}.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}.btn:disabled{opacity:.6;cursor:not-allowed}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--soft);padding:9px 12px;font-weight:850;color:#334155}.progress{height:14px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:18px 0}.bar{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),#22c55e);transition:width .35s ease}.card{border:2px solid #eef2ff;border-radius:28px;background:white;padding:clamp(20px,4vw,42px);text-align:center;min-height:310px;display:grid;place-items:center;position:relative}.topic{position:absolute;top:16px;left:16px;background:#f1f5f9;color:#475569;border-radius:999px;padding:7px 10px;font-size:.82rem;font-weight:900}.word{font-size:clamp(2.2rem,7.5vw,5.4rem);font-weight:950;letter-spacing:-.045em;line-height:.95}.hint{color:var(--muted);font-size:1.05rem;margin-top:14px}.translation{font-size:clamp(1.75rem,5vw,3.45rem);font-weight:930;color:#244ec2}.answer-row{display:grid;grid-template-columns:1fr auto;gap:10px;width:min(560px,100%);margin:20px auto 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(720px,100%);margin:24px auto 0}.choice{border:2px solid var(--line);border-radius:18px;padding:18px 12px;background:white;font-size:1.08rem;font-weight:850;cursor:pointer;min-height:64px}.choice:hover{border-color:var(--primary)}.choice.correct{border-color:var(--good);background:#dcfce7}.choice.wrong{border-color:var(--bad);background:#fee2e2}.feedback{min-height:32px;margin-top:16px;font-weight:900}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}.small{font-size:.9rem;color:var(--muted);line-height:1.45}.stat-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0;color:#334155}.meter{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.meter span{display:block;height:100%;background:var(--primary)}details{margin-top:16px}summary{cursor:pointer;font-weight:850;color:#334155}.word-list{max-height:245px;overflow:auto;margin-top:10px;display:flex;flex-wrap:wrap;gap:7px}.word-chip{background:#f8fafc;border:1px solid #e2e8f0;border-radius:999px;padding:6px 9px;font-size:.85rem}footer{text-align:center;color:var(--muted);font-size:.86rem;padding:10px 16px 30px}.hidden{display:none!important}@media(max-width:860px){.wrap{grid-template-columns:1fr}.panel{position:static}.trainer{min-height:480px}.choices{grid-template-columns:1fr}.answer-row{grid-template-columns:1fr}.btn{width:100%}.btns .btn{flex:1 1 160px}.card{min-height:280px}}@media(pointer:coarse){.choice,.btn,select,input{min-height:54px}.segmented button{min-height:48px}}

<body>
<header>
<div><h1>Englisch-Trainer</h1><p class="subtitle">Themen gezielt üben.</p></div>
</header>
<main class="wrap">
<aside>
<section class="panel">
<label for="gradeSelect">Klasse</label><select id="gradeSelect"><option value="3">Klasse 3</option><option value="5">Klasse 5</option></select>
<label for="topicSelect">Themengebiet</label><select id="topicSelect"></select>
<label>Übungsart</label><div class="segmented"><button data-mode="cards" class="active">Karten</button><button data-mode="quiz">Quiz</button><button data-mode="type">Schreiben</button></div>
<label for="directionSelect">Richtung</label><select id="directionSelect"><option value="en-de">Englisch → Deutsch</option><option value="de-en">Deutsch → Englisch</option></select>
<label class="toggle"><input type="checkbox" id="hardFirst" checked> Schwache Wörter häufiger üben</label>
<label class="toggle"><input type="checkbox" id="soundOn" checked> Aussprache-Button anzeigen</label>
<div class="btns"><button class="btn" id="newBtn">Neue Runde</button></div>
<details open><summary>Wörter im aktuellen Thema</summary><div class="word-list" id="wordList"></div></details>
</section>
<section class="stats"><strong>Fortschritt</strong><div id="statsBox"></div></section>
</aside>
<section class="trainer">
<div class="topline"><span class="badge" id="roundInfo">Bereit</span><span class="badge" id="scoreInfo">0 richtig</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card" id="card"><span class="topic" id="topicBadge">Thema</span><div><div class="word" id="prompt">Los geht’s!</div><p class="hint" id="hint">Wähle ein Thema und starte eine Runde.</p></div></div>
<div id="cardControls" class="btns"><button class="btn secondary" id="speakBtn">🔊 Anhören</button><button class="btn" id="showBtn">Antwort zeigen</button><button class="btn bad hidden" id="wrongBtn">Noch üben</button><button class="btn good hidden" id="rightBtn">Konnte ich</button></div>
<div id="quizControls" class="choices hidden"></div>
<div id="typeControls" class="hidden"><div class="answer-row"><input id="typeInput" type="text" autocomplete="off" placeholder="Antwort eintippen …"><button class="btn" id="checkBtn">Prüfen</button></div></div>
<div class="feedback" id="feedback"></div>
<div class="btns"><button class="btn secondary hidden" id="nextBtn">Weiter</button></div>
</section>
</main>

const clean=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/\(.*?\)/g,'').replace(/\/.*$/,'').replace(/[^a-zäöüß0-9 -]/g,'').trim();function progressKey(){return progressPrefix+currentGrade}function wordKey(w){return `${w.t}|${w.en}|${w.de}`}function loadProgress(){const legacy=currentGrade==='3'?localStorage.getItem('englishTrainerKlasse3_clean_v5'):null;const saved=localStorage.getItem(progressKey())||legacy||'{}';try{return JSON.parse(saved)}catch{return {}}}function save(){localStorage.setItem(progressKey(),JSON.stringify(progress))}function setGrade(grade){if(!VOCAB_BY_GRADE[grade])return;currentGrade=grade;VOCAB=VOCAB_BY_GRADE[currentGrade];progress=loadProgress();localStorage.setItem(gradeKey,currentGrade);$('gradeSelect').value=currentGrade;renderTopics();renderWordList();renderStats();startRound()}function rec(w){return progress[wordKey(w)]||progress[w.en]||{ok:0,bad:0,last:0}}function setRec(w,good){const key=wordKey(w);const r=rec(w);good?r.ok++:r.bad++;r.last=Date.now();progress[key]=r;save();renderStats()}function topics(){return ['Alle Themen',...Array.from(new Set(VOCAB.map(v=>v.t))).sort()]}function topicLabel(t){return t==='Alle Themen'?`Alle Themen (${VOCAB.length})`:`${t} (${VOCAB.filter(v=>v.t===t).length})`}function renderTopics(){const select=$('topicSelect');select.innerHTML='';topics().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=topicLabel(t);select.appendChild(o)})}function selectedWords(){const t=$('topicSelect').value;return t==='Alle Themen'?VOCAB:VOCAB.filter(v=>v.t===t)}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function weighted(words){let arr=[];for(const w of words){const r=rec(w);const weight=$('hardFirst').checked?Math.max(1,4+r.bad-r.ok):1;for(let i=0;i<weight;i++)arr.push(w)}return shuffle(arr)}
function init(){$('gradeSelect').value=currentGrade;$('gradeSelect').onchange=e=>setGrade(e.target.value);renderTopics();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;startRound()});$('topicSelect').onchange=()=>{renderWordList();renderStats();startRound()};$('directionSelect').onchange=startRound;$('hardFirst').onchange=startRound;$('soundOn').onchange=()=>current&&renderCard();$('newBtn').onclick=startRound;$('showBtn').onclick=showAnswer;$('rightBtn').onclick=()=>answer(true);$('wrongBtn').onclick=()=>answer(false);$('nextBtn').onclick=next;$('speakBtn').onclick=()=>speak(current?.en);$('checkBtn').onclick=checkTyped;$('typeInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkTyped()});renderWordList();renderStats();startRound()}
function startRound(){deck=weighted(selectedWords()).slice(0,20);asked=0;correct=0;next()}function next(){ $('feedback').textContent='';$('feedback').className='feedback';$('nextBtn').classList.add('hidden');$('rightBtn').classList.add('hidden');$('wrongBtn').classList.add('hidden');if(deck.length===0){$('topicBadge').textContent=$('topicSelect').value;$('prompt').textContent='Runde geschafft!';$('hint').textContent=`${correct} richtige Antworten.`;$('roundInfo').textContent='Fertig';$('bar').style.width='100%';return}current=deck.pop();asked++;renderCard()}
function renderCard(){const dir=$('directionSelect').value;const answer=dir==='en-de'?current.de:current.en;$('topicBadge').textContent=current.t;$('prompt').textContent=dir==='en-de'?current.en:current.de;$('hint').textContent=mode==='cards'?'Überlege die Antwort und tippe dann auf „Antwort zeigen“.':mode==='quiz'?'Wähle die richtige Antwort aus.':'Tippe die Übersetzung ein.';$('roundInfo').textContent=`${asked} / ${asked+deck.length}`;$('scoreInfo').textContent=`${correct} richtig`;$('bar').style.width=`${((asked-1)/(asked+deck.length))*100}%`;$('speakBtn').classList.toggle('hidden',!$('soundOn').checked||dir!=='en-de');$('cardControls').classList.toggle('hidden',mode!=='cards');$('showBtn').classList.remove('hidden');$('quizControls').classList.toggle('hidden',mode!=='quiz');$('typeControls').classList.toggle('hidden',mode!=='type');$('typeInput').value='';if(mode==='quiz')renderQuiz(answer);setTimeout(()=>$('typeInput').focus(),50)}
function showAnswer(){const dir=$('directionSelect').value;$('prompt').innerHTML=`<span class="translation">${dir==='en-de'?current.de:current.en}</span>`;$('hint').textContent=`${current.en} = ${current.de}`;$('showBtn').classList.add('hidden');$('rightBtn').classList.remove('hidden');$('wrongBtn').classList.remove('hidden')}function answer(good){setRec(current,good);if(good)correct++;$('scoreInfo').textContent=`${correct} richtig`;next()}
function renderQuiz(answer){const dir=$('directionSelect').value;let pool=selectedWords().filter(w=>w!==current);let opts=shuffle(pool).slice(0,3).map(w=>dir==='en-de'?w.de:w.en);opts=shuffle([answer,...opts]);$('quizControls').innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{const ok=o===answer;b.classList.add(ok?'correct':'wrong');[...$('quizControls').children].forEach(x=>{x.disabled=true;if(x.textContent===answer)x.classList.add('correct')});$('feedback').textContent=ok?'Richtig!':'Fast – richtig ist: '+answer;$('feedback').className='feedback '+(ok?'good':'bad');setRec(current,ok);if(ok)correct++;$('scoreInfo').textContent=`${correct} richtig`;$('nextBtn').classList.remove('hidden')};$('quizControls').appendChild(b)})}
function checkTyped(){const dir=$('directionSelect').value;const ans=dir==='en-de'?current.de:current.en;const val=$('typeInput').value;const accepted=[ans,...(dir==='de-en'?(current.aliases||[]):[])];const ok=accepted.some(a=>clean(val)===clean(a)||clean(a).split(' ').includes(clean(val)));$('feedback').textContent=ok?'Richtig!':`Noch nicht. Richtig: ${ans}`;$('feedback').className='feedback '+(ok?'good':'bad');setRec(current,ok);if(ok)correct++;$('scoreInfo').textContent=`${correct} richtig`;$('nextBtn').classList.remove('hidden')}function speak(text){if(!('speechSynthesis'in window)||!text)return;const u=new SpeechSynthesisUtterance(text.replace(/\/.*$/,''));u.lang='en-GB';u.rate=.86;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}function renderWordList(){const words=selectedWords();$('wordList').innerHTML=words.map(w=>`<span class="word-chip">${w.en} – ${w.de}</span>`).join('')}function renderStats(){const words=selectedWords();const total=words.length;const known=words.filter(w=>rec(w).ok>=2&&rec(w).ok>=rec(w).bad).length;const weak=words.filter(w=>rec(w).bad>rec(w).ok).length;$('statsBox').innerHTML=`<div class="stat-row"><span>Wörter im Thema</span><strong>${total}</strong></div><div class="stat-row"><span>Sicher</span><strong>${known}</strong></div><div class="meter"><span style="width:${total?known/total*100:0}%"></span></div><div class="stat-row"><span>Noch üben</span><strong>${weak}</strong></div>`}init();
</script>
